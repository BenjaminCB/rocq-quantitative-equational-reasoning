[mcp_servers.rocq]
command = "rocq-mcp"
startup_timeout_sec = 120
tool_timeout_sec = 300
enabled = true

[mcp_servers.rocq.tools.rocq_compile_file]
approval_mode = "approve"

[mcp_servers.rocq.tools.rocq_query]
approval_mode = "approve"

[mcp_servers.rocq.tools.rocq_start]
approval_mode = "approve"

[mcp_servers.rocq.tools.rocq_toc]
approval_mode = "approve"

[mcp_servers.rocq.tools.rocq_health]
approval_mode = "approve"

[mcp_servers.rocq.tools.rocq_compile]
approval_mode = "approve"

[mcp_servers.rocq.tools.rocq_check]
approval_mode = "approve"

[mcp_servers.rocq.tools.rocq_diag]
approval_mode = "approve"

[mcp_servers.rocq.tools.rocq_notations]
approval_mode = "approve"

[mcp_servers.local-rag]
command = "npx"
args = ["-y", "mcp-local-rag"]
startup_timeout_sec = 60
tool_timeout_sec = 300
enabled = true

[mcp_servers.local-rag.env]
BASE_DIR = "docs"

[mcp_servers.local-rag.tools.query_documents]
approval_mode = "approve"

[mcp_servers.local-rag.tools.list_files]
approval_mode = "approve"

[mcp_servers.local-rag.tools.ingest_file]
approval_mode = "approve"

[mcp_servers.local-rag.tools.read_chunk_neighbors]
approval_mode = "approve"

[mcp_servers.local-rag.tools.status]
approval_mode = "approve"
